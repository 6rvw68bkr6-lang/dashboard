<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRAMEBY 주간 운영 대시보드</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel-line: rgba(255,255,255,.08);
      --text: #eef3ff;
      --muted: #8f9bb7;
      --blue: #5b7cfa;
      --cyan: #22d3ee;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #fb7185;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(91,124,250,.25), transparent 30%),
        radial-gradient(circle at 85% 5%, rgba(34,211,238,.16), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { padding: 28px 20px; border-right: 1px solid var(--panel-line); background: rgba(9,14,28,.84); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .logo { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: grid; place-items: center; font-weight: 900; }
    .brand strong { display:block; font-size: 18px; }
    .brand span { color: var(--muted); font-size: 12px; }
    .nav-title { font-size: 11px; color: var(--muted); letter-spacing: .12em; margin: 22px 12px 10px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; color: #cfd7ee; border-radius: 15px; margin-bottom: 8px; font-size: 14px; cursor: pointer; transition: .18s; }
    .nav-item:hover { background: rgba(255,255,255,.05); }
    .nav-item.active { background: linear-gradient(135deg, rgba(91,124,250,.24), rgba(34,211,238,.12)); border: 1px solid rgba(91,124,250,.42); color: #fff; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
    .active .dot { background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }

    main { padding: 28px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
    .title h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.04em; }
    .title p { margin: 0; color: var(--muted); font-size: 14px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .pill, select, button, input[type="date"] { border: 1px solid var(--panel-line); background: rgba(255,255,255,.05); color: #d7def4; padding: 10px 14px; border-radius: 999px; font-size: 13px; }
    select, input[type="date"] { outline: none; color-scheme: dark; }
    .custom-date { display: none; gap: 8px; align-items: center; }
    .custom-date.show { display: flex; }
    button { cursor: pointer; background: linear-gradient(135deg, rgba(91,124,250,.55), rgba(34,211,238,.28)); }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
    .card { background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025)); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.22); position: relative; overflow: hidden; }
    .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 0%, rgba(255,255,255,.08), transparent 28%); pointer-events: none; }
    .kpi { grid-column: span 3; min-height: 146px; }
    .wide { grid-column: span 8; min-height: 370px; }
    .side { grid-column: span 4; min-height: 370px; }
    .half { grid-column: span 6; min-height: 300px; }
    .third { grid-column: span 4; min-height: 280px; }
    .full { grid-column: span 12; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; z-index: 1; }
    .card-title { font-size: 14px; color: #dce5ff; font-weight: 700; }
    .card-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .badge { font-size: 12px; padding: 7px 10px; border-radius: 999px; background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.24); white-space: nowrap; }
    .badge.warn { background: rgba(251,191,36,.12); color: var(--yellow); border-color: rgba(251,191,36,.24); }
    .badge.danger { background: rgba(251,113,133,.12); color: var(--red); border-color: rgba(251,113,133,.24); }
    .kpi-value { font-size: 34px; font-weight: 900; letter-spacing: -0.05em; margin: 10px 0 8px; position: relative; z-index: 1; }
    .kpi-caption { color: var(--muted); font-size: 13px; position: relative; z-index: 1; }
    .spark { display: flex; align-items: end; gap: 5px; height: 42px; margin-top: 18px; position: relative; z-index: 1; }
    .bar { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--cyan), var(--blue)); opacity: .8; min-height: 2px; }

    .chart-area { display: grid; grid-template-columns: 46px repeat(7, 1fr); grid-template-rows: repeat(5, 42px) 38px; gap: 0 10px; position: relative; z-index: 1; margin-top: 22px; }
    .y-label { color: var(--muted); font-size: 11px; text-align: right; padding-right: 8px; }
    .grid-line { border-top: 1px dashed rgba(255,255,255,.08); grid-column: 2 / -1; }
    .vbar-wrap { grid-row: 1 / 6; align-self: end; display: flex; align-items: end; height: 210px; background: rgba(255,255,255,.03); border-radius: 14px; overflow: hidden; }
    .vbar { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, #65e4ff, #5b7cfa); min-height: 3px; }
    .x-label { color: var(--muted); font-size: 11px; text-align: center; align-self: center; line-height: 1.35; }

    .simple-bar-scroll { position: relative; z-index: 1; width: 100%; overflow-x: auto; padding-bottom: 4px; }
    .simple-bar-scroll::-webkit-scrollbar { height: 8px; }
    .simple-bar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; }
    .simple-bar-chart { position: relative; display: flex; align-items: end; gap: 14px; height: 280px; padding: 18px 0 58px; border-bottom: 1px dashed rgba(255,255,255,.08); min-width: 100%; }
    .simple-bar-chart.many { gap: 10px; min-width: max-content; }
    .simple-bar-col { flex: 1; min-width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 8px; position: relative; }
    .simple-bar-chart.many .simple-bar-col { flex: 0 0 58px; min-width: 58px; }
    .simple-bar-wrap { width: 100%; height: 210px; display: flex; align-items: end; background: rgba(255,255,255,.03); border-radius: 14px; overflow: hidden; }
    .simple-bar { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, #65e4ff, #5b7cfa); min-height: 4px; }
    .simple-bar-wrap.has-issue { border: 1px solid rgba(251,191,36,.38); box-shadow: inset 0 0 0 1px rgba(251,191,36,.12); }
    .issue-marker { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(251,191,36,.18); color: var(--yellow); border: 1px solid rgba(251,191,36,.42); font-weight: 900; font-size: 12px; z-index: 2; }
    .simple-bar-issue { color: var(--yellow); font-size: 11px; font-weight: 800; margin-top: -4px; }
    .simple-bar-label { position: absolute; bottom: -46px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .simple-bar-value { color: #dce5ff; font-size: 12px; font-weight: 800; }

    .issue-list { display: grid; gap: 12px; position: relative; z-index: 1; }
    .issue { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 13px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); }
    .issue-icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: rgba(91,124,250,.14); }
    .issue strong { display: block; font-size: 14px; margin-bottom: 3px; }
    .issue span { color: var(--muted); font-size: 12px; }
    .issue-num { font-weight: 800; font-size: 18px; }
    .progress-block { position: relative; z-index: 1; display: grid; gap: 16px; }
    .progress-row { display: grid; gap: 8px; }
    .progress-top { display:flex; justify-content:space-between; font-size:13px; color:#dce5ff; }
    .track { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }

    table { width: 100%; border-collapse: collapse; position: relative; z-index: 1; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 600; padding: 12px 10px; border-bottom: 1px solid var(--panel-line); }
    td { padding: 14px 10px; border-bottom: 1px solid rgba(255,255,255,.05); color: #e8eeff; }
    .right { text-align: right; }
    .muted { color: var(--muted); }
    .error { color: var(--red); font-size: 13px; margin-top: 8px; }
    .empty { color: var(--muted); padding: 24px 0; position: relative; z-index: 1; }
    .table-wrap { position: relative; z-index: 1; overflow-x: auto; }
    .table-tools { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .tool-left, .tool-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 14px; position: relative; z-index: 1; }
    .page-info { color: var(--muted); font-size: 13px; padding: 0 6px; }
    .rank-chart { display: grid; gap: 12px; position: relative; z-index: 1; }
    .rank-row { display: grid; grid-template-columns: minmax(160px, 1fr) 3fr 120px 80px; gap: 12px; align-items: center; }
    .rank-name { font-size: 13px; color: #e8eeff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-track { height: 16px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    .rank-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .rank-value { text-align: right; font-size: 13px; color: #dce5ff; font-weight: 700; }
    .rank-qty { text-align: right; font-size: 13px; color: var(--yellow); font-weight: 800; }
    .flow-wrap { position: relative; z-index: 1; margin-top: 20px; }
    .flow-grid {
      position: absolute;
      inset: 0 0 34px 0;
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      pointer-events: none;
    }
    .flow-grid div {
      border-top: 1px dashed rgba(255,255,255,.07);
    }
    .flow-chart {
      height: 360px;
      display: flex;
      align-items: end;
      gap: 16px;
      padding: 18px 0 34px;
      position: relative;
    }
    .flow-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: center;
      gap: 10px;
      min-width: 72px;
    }
    .flow-bar-wrap {
      width: 100%;
      height: 280px;
      display: flex;
      align-items: end;
      position: relative;
    }
    .flow-bar {
      width: 100%;
      border-radius: 18px 18px 8px 8px;
      background: linear-gradient(180deg, #63e2ff 0%, #5b7cfa 100%);
      box-shadow: 0 10px 30px rgba(91,124,250,.28);
      min-height: 6px;
      transition: .2s;
      position: relative;
    }
    .flow-bar:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }
    .flow-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .flow-summary .pill {
      background: rgba(255,255,255,.04);
    }

    .flow-money {
      font-size: 15px;
      font-weight: 900;
      color: #eef3ff;
      letter-spacing: -0.03em;
      margin-top: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    .flow-qty {
      font-size: 12px;
      font-weight: 800;
      color: var(--yellow);
      margin-top: 2px;
    }

    .flow-label {
      font-size: 13px;
      color: #cfd7ee;
      margin-top: 8px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .flow-money.compact {
      font-size: 13px;
      opacity: .95;
    }

    .flow-label.compact {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .kpi, .wide, .side, .half, .third { grid-column: span 12; }
      main { padding: 18px; }
      .topbar { flex-direction: column; }
      .filters { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">FB</div><div><strong>FRAMEBY</strong><span>Weekly Operation</span></div></div>
      <div class="nav-title">DASHBOARD</div>
      <div class="nav-item active" data-tab="overview"><i class="dot"></i> 종합 현황</div>
      <div class="nav-item" data-tab="shipping"><i class="dot"></i> 택배 / 출고</div>
      <div class="nav-item" data-tab="production"><i class="dot"></i> 제작 현황</div>
      <div class="nav-item" data-tab="payment"><i class="dot"></i> 결제 관리</div>
      <div class="nav-item" data-tab="inbound"><i class="dot"></i> 입고 예정</div>
      <div class="nav-item" data-tab="coupang"><i class="dot"></i> 쿠팡 판매</div>
      <div class="nav-item" data-tab="reorder"><i class="dot"></i> 발주 필요</div>
      <div class="nav-title">DATA SOURCE</div>
      <div class="nav-item"><i class="dot"></i> Google Sheets</div>
      <div class="nav-item"><i class="dot"></i> <span id="lastSync">동기화 대기</span></div>
    </aside>

    <main>
      <section class="topbar">
        <div class="title">
          <h1 id="pageTitle">주간 운영 대시보드</h1>
          <p id="pageDesc">구글시트 데이터를 불러와 택배, 제작, 결제, 입고, 쿠팡, 발주 필요 현황을 운영용으로 확인합니다.</p>
          <div id="loadError" class="error"></div>
        </div>
        <div class="filters">
          <select id="periodSelect">
            <option value="7">최근 7일</option>
            <option value="14">최근 14일</option>
            <option value="30">최근 30일</option>
            <option value="month">당월</option>
            <option value="custom">직접 선택</option>
          </select>
          <div class="custom-date" id="customDateBox">
            <input type="date" id="startDateInput" />
            <input type="date" id="endDateInput" />
          </div>
          <button onclick="applyPeriodAndRender()">기간 적용</button>
          <button onclick="refreshDashboard()">라이브 동기화</button>
          <div class="pill" id="periodLabel">기간 계산 중</div>
        </div>
      </section>
      <section class="grid" id="dashboardGrid"></section>
    </main>
  </div>

  <script>
    const SHEET_ID = '1aAr8wNaNbO8Ts3lQivHxnpBy8aY9IKPB1HokkO7mYq0';
    const SHEETS = {
      products: { name: '마스터_상품', gid: '428285962' },
      vendors: { name: '마스터_거래처', gid: '1631036706' },
      shipping: { name: '택배_일별', gid: '193782488' },
      payments: { name: '결제_예정 및 완료', gid: '1820176351' },
      po: { name: '결제_PO관리', gid: '1194893570' },
      inbound: { name: '입고_예정', gid: '1161427398' },
      production: { name: '제작_일별', gid: '428106612' },
      coupang: { name: '쿠팡_판매', gid: '2007402832' },
      reorder: { name: '발주_필요', gid: '164754989' }
    };

    const state = { tab: 'overview', loaded: false, raw: {}, shipping: [], filteredShipping: [], generic: {}, coupang: { page: 1, pageSize: 30, basis: 'supply', date: '', flowMode: 'daily' }, payment: { vendorPeriod: 'monthly', selectedVendor: 'all', startMonth: '', endMonth: '', selectedFlowPeriod: '' } };

    const titles = {
      overview: ['주간 운영 대시보드', '전체 운영 상황을 대표 보고용으로 요약합니다.'],
      shipping: ['택배 / 출고 현황', '일별 출고량, 누락, 오배송, 문제율을 확인합니다.'],
      production: ['제작 현황', '제작 일별 데이터를 기준으로 생산/불량/진행 상태를 확인합니다.'],
      payment: ['결제 관리', '결제 예정 및 완료, PO 관련 금액 흐름을 확인합니다.'],
      inbound: ['입고 예정', '입고 예정 건과 지연 가능 항목을 확인합니다.'],
      coupang: ['쿠팡 판매', '쿠팡 판매수량, 매출, 출고 흐름을 확인합니다.'],
      reorder: ['발주 필요', '품절 위험과 발주 우선순위를 확인합니다.']
    };

    function csvUrl(gid) { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`; }

    function parseCSV(text) {
      const rows = [];
      let row = [], value = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i], next = text[i + 1];
        if (char === '"' && inQuotes && next === '"') { value += '"'; i++; }
        else if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { row.push(value); value = ''; }
        else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (value || row.length) { row.push(value); rows.push(row); row = []; value = ''; }
          if (char === '\r' && next === '\n') i++;
        } else value += char;
      }
      if (value || row.length) { row.push(value); rows.push(row); }
      return rows.filter(r => r.some(c => String(c).trim() !== ''));
    }

    async function loadSheet(gid) {
      const res = await fetch(csvUrl(gid));
      if (!res.ok) throw new Error(`시트 로드 실패: ${res.status}`);
      return parseCSV(await res.text());
    }

    function toNum(v) {
      if (v === undefined || v === null || v === '') return 0;
      return Number(String(v).replace(/,/g, '').replace(/[^0-9.-]/g, '')) || 0;
    }

    function toDate(v) {
      if (v === undefined || v === null || v === '') return null;
      const raw = String(v).trim();

      const gvDate = raw.match(/Date[(]([0-9]{4}),[ ]*([0-9]{1,2}),[ ]*([0-9]{1,2})[)]/);
      if (gvDate) {
        return new Date(Number(gvDate[1]), Number(gvDate[2]), Number(gvDate[3]));
      }

      const krDate = raw.match(/([0-9]{4})[ ]*년[ ]*([0-9]{1,2})[ ]*월[ ]*([0-9]{1,2})[ ]*일/);
      if (krDate) {
        return new Date(Number(krDate[1]), Number(krDate[2]) - 1, Number(krDate[3]));
      }

      const normal = raw.split(' ')[0].replaceAll('.', '-').replaceAll('/', '-');
      const direct = normal.match(/^([0-9]{4})-([0-9]{1,2})-([0-9]{1,2})$/);
      if (direct) {
        return new Date(Number(direct[1]), Number(direct[2]) - 1, Number(direct[3]));
      }

      if (/^[0-9]+([.][0-9]+)?$/.test(raw)) {
        const serial = Number(raw);
        if (serial > 20000 && serial < 80000) {
          const base = new Date(Date.UTC(1899, 11, 30));
          base.setUTCDate(base.getUTCDate() + Math.floor(serial));
          return new Date(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate());
        }
      }

      const d = new Date(raw);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }
    function money(n) { return `${fmt(n)}원`; }
    function usd(n) { return `$${fmt(Math.round(Number(n || 0)))}`; }
    function usdToKrw(n) { return Math.round(Number(n || 0) * 1500); }
    function pct(num, den) { return den ? `${((num / den) * 100).toFixed(2)}%` : '0.00%'; }
    function dateStr(d) { return d ? d.toISOString().slice(0, 10) : '-'; }
    function grid(html) { document.getElementById('dashboardGrid').innerHTML = html; }

    function rowsToObjects(rows) {
      const header = rows[0] || [];
      return rows.slice(1).map(r => {
        const obj = Object.fromEntries(header.map((h, i) => [h || `col${i}`, r[i] || '']));
        obj._row = r;
        return obj;
      });
    }

    function getCurrentPeriodRange() {
      const option = document.getElementById('periodSelect').value;
      const allDates = state.shipping.map(r => r.date).filter(Boolean);
      if (!allDates.length) return { start: null, end: null };

      const maxDate = new Date(Math.max(...allDates.map(d => d.getTime())));
      const minDate = new Date(Math.min(...allDates.map(d => d.getTime())));
      let start;
      let end = maxDate;

      if (option === 'custom') {
        const startValue = document.getElementById('startDateInput').value;
        const endValue = document.getElementById('endDateInput').value;
        start = startValue ? new Date(startValue + 'T00:00:00') : minDate;
        end = endValue ? new Date(endValue + 'T00:00:00') : maxDate;
        if (start > end) [start, end] = [end, start];
      } else if (option === 'month') {
        start = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
      } else {
        start = new Date(maxDate);
        start.setDate(start.getDate() - Number(option) + 1);
      }

      return { start, end };
    }

    function filterObjectsByDate(objects, dateKey) {
      if (!dateKey) return objects;
      const { start, end } = getCurrentPeriodRange();
      if (!start || !end) return objects;

      return objects.filter(o => {
        const raw = o[dateKey];
        const d = toDate(raw);

        if (!d) return false;

        const compare = new Date(d);
        compare.setHours(0,0,0,0);

        const startDate = new Date(start);
        startDate.setHours(0,0,0,0);

        const endDate = new Date(end);
        endDate.setHours(23,59,59,999);

        return compare >= startDate && compare <= endDate;
      });
    }

    function getShippingData(rows) {
      const header = rows[0] || [];
      const idx = {
        date: header.indexOf('날짜'),
        ship: header.indexOf('출고수량'),
        missing: header.indexOf('누락건수'),
        misdelivery: header.indexOf('오배송건수')
      };
      return rows.slice(1).map(r => ({
        date: toDate(r[idx.date]),
        dateText: r[idx.date],
        shipments: toNum(r[idx.ship]),
        missing: toNum(r[idx.missing]),
        misdelivery: toNum(r[idx.misdelivery])
      })).filter(r => r.date);
    }

    function filterByPeriod(data) {
      const option = document.getElementById('periodSelect').value;
      const customBox = document.getElementById('customDateBox');
      customBox.classList.toggle('show', option === 'custom');

      if (!data.length) return [];
      const maxDate = new Date(Math.max(...data.map(r => r.date.getTime())));
      const minDate = new Date(Math.min(...data.map(r => r.date.getTime())));
      let start;
      let end = maxDate;

      if (option === 'custom') {
        const startValue = document.getElementById('startDateInput').value;
        const endValue = document.getElementById('endDateInput').value;
        start = startValue ? new Date(startValue + 'T00:00:00') : minDate;
        end = endValue ? new Date(endValue + 'T00:00:00') : maxDate;
        if (start > end) [start, end] = [end, start];
      } else if (option === 'month') {
        start = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
      } else {
        start = new Date(maxDate);
        start.setDate(start.getDate() - Number(option) + 1);
      }

      const filtered = data.filter(r => r.date >= start && r.date <= end);
      document.getElementById('periodLabel').textContent = `${dateStr(start)} ~ ${dateStr(end)}`;
      return filtered;
    }

    function applyPeriodAndRender() {
      if (!state.shipping.length) return;
      state.filteredShipping = filterByPeriod(state.shipping);
      state.coupang.date = '';
      state.coupang.page = 1;
      renderCurrentTab();
    }

    function metricCard(title, sub, value, caption, tone = 'good', spark = []) {
      const cls = tone === 'danger' ? 'danger' : tone === 'warn' ? 'warn' : '';
      const max = Math.max(...spark, 1);
      const bars = spark.map(v => `<div class="bar" style="height:${Math.max((v / max) * 100, 3)}%"></div>`).join('');
      return `<article class="card kpi"><div class="card-head"><div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div><span class="badge ${cls}">${tone === 'danger' ? '즉시 확인' : tone === 'warn' ? '관리 필요' : '운영 KPI'}</span></div><div class="kpi-value">${value}</div><div class="kpi-caption">${caption}</div><div class="spark">${bars}</div></article>`;
    }

    function renderBarChart(data, valueKey, labelKey = 'date', options = {}) {
      const baseItems = options.hideZero ? data.filter(r => Number(r[valueKey] || 0) > 0) : data;
      const items = options.limit ? baseItems.slice(-options.limit) : baseItems;
      const max = Math.max(...items.map(r => Number(r[valueKey] || 0)), 1);

      if (!items.length) return '<div class="empty">차트로 표시할 데이터가 없습니다.</div>';

      return `<div class="simple-bar-scroll"><div class="simple-bar-chart ${items.length > 12 ? 'many' : ''}">${items.map(r => {
        const label = r.date ? `${r.date.getMonth()+1}/${r.date.getDate()}` : String(r[labelKey] || '-').slice(0, 10);
        const value = Number(r[valueKey] || 0);
        const height = value > 0 ? Math.max((value / max) * 100, 2) : 1;
        const issue = Number(r.missing || 0) + Number(r.misdelivery || 0);
        const issueHtml = issue > 0 ? `<div class="issue-marker" title="누락 ${fmt(r.missing || 0)}건 / 오배송 ${fmt(r.misdelivery || 0)}건">!</div>` : '';
        const issueText = issue > 0 ? `<div class="simple-bar-issue">문제 ${fmt(issue)}</div>` : '';
        return `
          <div class="simple-bar-col">
            <div class="simple-bar-wrap ${issue > 0 ? 'has-issue' : ''}">
              ${issueHtml}
              <div class="simple-bar" style="height:${height}%"></div>
            </div>
            <div class="simple-bar-value">${fmt(value)}</div>
            ${issueText}
            <div class="simple-bar-label">${label}</div>
          </div>
        `;
      }).join('')}</div></div>`;
    }

    function analyzeGeneric(rows, config) {
      const allObjects = rowsToObjects(rows);
      const headers = rows[0] || [];
      const dateKey = headers.find(h => config.date.some(k => String(h).replaceAll(' ', '').includes(k)));
      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;
      const numKeys = headers.filter(h => objects.some(o => toNum(o[h]) > 0));
      const mainKey = numKeys.find(h => config.primary.some(k => String(h).replaceAll(' ', '').includes(k))) || numKeys[0];
      const total = mainKey ? objects.reduce((s,o)=>s+toNum(o[mainKey]),0) : objects.length;
      const dated = objects.map(o => ({ raw:o, date: toDate(o[dateKey]), value: mainKey ? toNum(o[mainKey]) : 1, label: o[dateKey] || o[headers[0]] || '-' })).filter(x => x.date || x.value || x.label);
      return { objects, allObjects, headers, dateKey, mainKey, total, dated };
    }

    function findHeader(headers, keywords, exclude = []) {
      return headers.find(h => {
        const text = String(h || '').replaceAll(' ', '').toLowerCase();
        return keywords.some(k => text.includes(String(k).replaceAll(' ', '').toLowerCase())) &&
               !exclude.some(k => text.includes(String(k).replaceAll(' ', '').toLowerCase()));
      });
    }

    function getCoupangAnalysis() {
      const rows = state.raw.coupang || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['날짜','일자','판매일','출고일','주문일','주문일자','매출일','정산일','date']);
      const qtyKey = findHeader(headers, ['판매수량','출고수량','수량','판매개수','개수']);

      // 총액 컬럼과 단가 컬럼을 분리한다.
      // 쿠팡 시트에서 '공급가액'이 단가처럼 들어오는 경우가 있어, 공급가액은 단가 후보로 우선 처리한다.
      const supplyTotalKey =
        findHeader(headers, ['총공급가액','공급가액합계','공급금액','판매금액','매출금액','총매출','실매출','결제금액'], ['단가','매입']);
      const supplyUnitKey =
        findHeader(headers, ['공급가액','공급가','판매가','판매단가','단가'], ['총','합계','금액','매입']);

      const purchaseTotalKey =
        findHeader(headers, ['매입금액','매입가액합계','원가금액','총원가'], ['단가']);
      const purchaseUnitKey =
        findHeader(headers, ['매입가','원가','매입단가'], ['합계','금액']);

      const taxKey = findHeader(headers, ['세액','부가세','vat']);
      let productKey = findHeader(headers, ['상품명','상품','제품명','제품','품목명','품목','옵션명','옵션','sku','SKU','모델','관리코드','바코드']);

      if (!productKey) {
        productKey = headers.find(h => {
          const text = String(h || '').replaceAll(' ', '').toLowerCase();
          if (!text) return false;
          if (text.includes('날짜') || text.includes('일자') || text.includes('date')) return false;
          if (text.includes('수량') || text.includes('금액') || text.includes('가액') || text.includes('단가') || text.includes('세액')) return false;
          return allObjects.some(o => String(o[h] || '').trim() && Number.isNaN(Number(String(o[h]).replace(/,/g, ''))));
        });
      }

      const periodObjects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;
      const periodDates = [...new Set(periodObjects.map(o => dateStr(toDate(o[dateKey]))).filter(d => d !== '-'))].sort();

      if (state.coupang.date && !periodDates.includes(state.coupang.date)) {
        state.coupang.date = '';
      }

      let objects = periodObjects;
      if (state.coupang.date && dateKey) {
        objects = objects.filter(o => dateStr(toDate(o[dateKey])) === state.coupang.date);
      }

      function rowQty(o) {
        return qtyKey ? toNum(o[qtyKey]) : 1;
      }

      function rowSupply(o) {
        if (supplyTotalKey) return toNum(o[supplyTotalKey]);
        if (supplyUnitKey) return toNum(o[supplyUnitKey]) * rowQty(o);
        return 0;
      }

      function rowPurchase(o) {
        if (purchaseTotalKey) return toNum(o[purchaseTotalKey]);
        if (purchaseUnitKey) return toNum(o[purchaseUnitKey]) * rowQty(o);
        return 0;
      }

      function rowTax(o) {
        if (taxKey) return toNum(o[taxKey]);
        return Math.round(rowSupply(o) * 0.1);
      }

      const basisKey = state.coupang.basis === 'purchase'
        ? (purchaseTotalKey || purchaseUnitKey || supplyTotalKey || supplyUnitKey)
        : (supplyTotalKey || supplyUnitKey || purchaseTotalKey || purchaseUnitKey);

      const totalQty = objects.reduce((s, o) => s + rowQty(o), 0);
      const totalSupply = objects.reduce((s, o) => s + rowSupply(o), 0);
      const totalPurchase = objects.reduce((s, o) => s + rowPurchase(o), 0);
      const totalTax = objects.reduce((s, o) => s + rowTax(o), 0);
      const totalBasis = state.coupang.basis === 'purchase' ? totalPurchase : totalSupply;

      function getFlowKey(date) {
        if (!date) return '-';
        if (state.coupang.flowMode === 'monthly') {
          return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }
        if (state.coupang.flowMode === 'weekly') {
          const temp = new Date(date);
          temp.setHours(0,0,0,0);
          const day = temp.getDay() || 7;
          temp.setDate(temp.getDate() + 4 - day);
          const yearStart = new Date(temp.getFullYear(),0,1);
          const weekNo = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);
          const month = temp.getMonth() + 1;
          return `${month}월 ${weekNo}주차`;
        }
        return dateStr(date);
      }

      const groupedMap = {};
      objects.forEach(o => {
        const rowDate = toDate(o[dateKey]);
        const d = getFlowKey(rowDate);
        if (d === '-') return;

        if (!groupedMap[d]) {
          groupedMap[d] = { raw: o, date: rowDate, label: d, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }

        groupedMap[d].qty += rowQty(o);
        groupedMap[d].supply += rowSupply(o);
        groupedMap[d].purchase += rowPurchase(o);
        groupedMap[d].tax += rowTax(o);
      });

      const dated = Object.values(groupedMap)
        .sort((a,b) => a.date - b.date)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }));

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) {
          productMap[name] = { name, qty: 0, supply: 0, purchase: 0, tax: 0, value: 0 };
        }
        productMap[name].qty += rowQty(o);
        productMap[name].supply += rowSupply(o);
        productMap[name].purchase += rowPurchase(o);
        productMap[name].tax += rowTax(o);
      });

      const productRank = Object.values(productMap)
        .map(r => ({ ...r, value: state.coupang.basis === 'purchase' ? r.purchase : r.supply }))
        .sort((a, b) => b.value - a.value);

      return {
        headers,
        allObjects,
        periodObjects,
        objects,
        dateKey,
        qtyKey,
        supplyTotalKey,
        supplyUnitKey,
        purchaseTotalKey,
        purchaseUnitKey,
        taxKey,
        productKey,
        basisKey,
        totalQty,
        totalBasis,
        totalSupply,
        totalPurchase,
        totalTax,
        dates: periodDates,
        dated,
        productRank
      };
    }

    function renderProductRankChart(items, limit = 10) {
      const safeItems = Array.isArray(items) ? items : [];
      const top = safeItems.filter(r => r && r.name).slice(0, limit);
      const max = Math.max(...top.map(r => r.value || 0), 1);
      if (!top.length) return '<div class="empty">품목 컬럼을 찾지 못했습니다. 쿠팡 기준 선택 카드의 감지 컬럼을 확인해 주세요.</div>';
      return `<div class="rank-chart">${top.map((r, i) => `
        <div class="rank-row">
          <div class="rank-name">${i + 1}. ${r.name}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.max((r.value / max) * 100, 2)}%"></div></div>
          <div class="rank-value">${money(r.value)}</div>
          <div class="rank-qty">${fmt(r.qty)}개</div>
        </div>
      `).join('')}</div>`;
    }

    function renderCoupangFlowChart(items, options = {}) {
      const safeItems = Array.isArray(items) ? items : [];
      const maxMoney = Math.max(...safeItems.map(r => r.value || 0), 1);
      const maxQty = Math.max(...safeItems.map(r => r.qty || 0), 1);

      if (!safeItems.length) {
        return '<div class="empty">흐름 차트로 표시할 데이터가 없습니다.</div>';
      }

      const best = [...safeItems].sort((a,b) => b.value - a.value)[0];
      const total = safeItems.reduce((s,r) => s + r.value, 0);
      const totalQty = safeItems.reduce((s,r) => s + r.qty, 0);

      const points = safeItems.map((r, i) => {
        const x = ((i + 0.5) / safeItems.length) * 100;
        const y = 280 - ((r.qty / maxQty) * 280);
        return `${x},${y}`;
      }).join(' ');

      return `
        <div class="flow-wrap">
          <div class="flow-grid">
            <div></div><div></div><div></div><div></div><div></div>
          </div>
          
          <div class="flow-chart">${safeItems.map(r => {
            const barHeight = Math.max((r.value / maxMoney) * 100, 2);
            const pointY = 280 - ((r.qty / maxQty) * 280);

            return `
              <div class="flow-col" ${options.clickFn ? `onclick="${options.clickFn}('${String(r.label).replace(/'/g, "\'")}')" style="cursor:pointer;"` : ''}>
                <div class="flow-bar-wrap">
                  
                  <div class="flow-bar" style="height:${barHeight}%"></div>
                </div>
                <div class="flow-money compact">${money(r.value)}</div>
                <div class="flow-qty">${fmt(r.qty)}개</div>
                <div class="flow-label compact">${r.label}</div>
              </div>
            `;
          }).join('')}</div>

          <div class="flow-summary">
            <div class="pill">최고 판매 구간: ${best?.label || '-'}</div>
            <div class="pill">최고 금액: ${money(best?.value || 0)}</div>
            <div class="pill">총 판매금액: ${money(total)}</div>
            <div class="pill">총 판매수량: ${fmt(totalQty)}개</div>
          </div>
        </div>
      `;
    }

    function renderCoupang() {
      const a = getCoupangAnalysis();
      if (!a.headers.length) {
        grid(`<article class="card full"><div class="card-head"><div><div class="card-title">쿠팡 판매</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">쿠팡_판매 시트 데이터를 불러오지 못했습니다.</div></article>`);
        return;
      }

      const totalPages = Math.max(Math.ceil(a.objects.length / state.coupang.pageSize), 1);
      state.coupang.page = Math.min(Math.max(state.coupang.page, 1), totalPages);
      const start = (state.coupang.page - 1) * state.coupang.pageSize;
      const pageRows = a.objects.slice(start, start + state.coupang.pageSize);
      const headers = a.headers;
      const basisLabel = state.coupang.basis === 'purchase' ? '매입가 기준' : '공급가 기준';
      const flowLabel = state.coupang.flowMode === 'monthly' ? '월간 집계' : state.coupang.flowMode === 'weekly' ? '주간 집계' : '일별 집계';

      const dateOptions = ['<option value="">전체 날짜</option>'].concat(a.dates.map(d => `<option value="${d}" ${state.coupang.date === d ? 'selected' : ''}>${d}</option>`)).join('');
      const table = pageRows.map(o => `<tr>${headers.map(h => `<td>${o[h] || '-'}</td>`).join('')}</tr>`).join('');

      grid(`
        ${metricCard('쿠팡 판매수량', a.qtyKey || '행 개수 기준', fmt(a.totalQty), '선택 기간 / 선택 날짜 기준', 'good', a.dated.slice(-7).map(r=>r.value))}
        ${metricCard('공급가액 합계', a.supplyTotalKey || a.supplyUnitKey || '공급가 컬럼 없음', money(a.totalSupply), a.supplyTotalKey ? '총액 컬럼 합계' : '수량 × 공급가액', 'good', a.dated.slice(-7).map(r=>r.supply))}
        ${metricCard('매입가 합계', a.purchaseTotalKey || a.purchaseUnitKey || '매입가 컬럼 없음', money(a.totalPurchase), a.purchaseTotalKey ? '총액 컬럼 합계' : '수량 × 매입가', 'warn', a.dated.slice(-7).map(r=>r.purchase))}
        ${metricCard('세액 합계', a.taxKey || '공급가액 10% 추정', money(a.totalTax), a.taxKey ? '선택 기간 기준 세액 합계' : '공급가액 × 10%', 'warn', a.dated.slice(-7).map(r=>r.tax))}

        <article class="card wide"><div class="card-head"><div><div class="card-title">쿠팡 판매 흐름</div><div class="card-sub">${basisLabel} / ${flowLabel} / 금액+수량 동시 표시</div></div><span class="badge">${a.basisKey || '기준 컬럼 없음'}</span></div>
          <div class="table-tools">
            <div class="tool-left">
              <select id="coupangFlowMode" onchange="setCoupangFlowMode(this.value)">
                <option value="daily" ${state.coupang.flowMode === 'daily' ? 'selected' : ''}>일별</option>
                <option value="weekly" ${state.coupang.flowMode === 'weekly' ? 'selected' : ''}>주간</option>
                <option value="monthly" ${state.coupang.flowMode === 'monthly' ? 'selected' : ''}>월간</option>
              </select>
              <div class="pill">파란 막대 = 판매금액</div>
              
              <div class="pill">미니멀 운영 분석형 차트</div>
            </div>
          </div>
          ${renderCoupangFlowChart(a.dated)}
        </article>

        <article class="card full"><div class="card-head"><div><div class="card-title">품목별 금액 순위</div><div class="card-sub">${basisLabel} / 선택 기간 기준 상위 10개 품목</div></div><span class="badge">금액 큰 순</span></div>${renderProductRankChart(a.productRank, 10)}</article>

        <article class="card side"><div class="card-head"><div><div class="card-title">쿠팡 기준 선택</div><div class="card-sub">날짜별 / 금액 기준 전환</div></div></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">📅</div><div><strong>날짜 선택</strong><span>${a.dateKey || '날짜열 감지 안됨'}</span></div><div></div></div>
          <select id="coupangDateSelect" onchange="setCoupangDate(this.value)">${dateOptions}</select>
          <div class="issue"><div class="issue-icon">₩</div><div><strong>금액 기준</strong><span>공급가 / 매입가 전환</span></div><div></div></div>
          <select id="coupangBasisSelect" onchange="setCoupangBasis(this.value)">
            <option value="supply" ${state.coupang.basis === 'supply' ? 'selected' : ''}>공급가 기준</option>
            <option value="purchase" ${state.coupang.basis === 'purchase' ? 'selected' : ''}>매입가 기준</option>
          </select>
          <div class="issue"><div class="issue-icon">🔎</div><div><strong>감지 컬럼</strong><span>수량: ${a.qtyKey || '-'} / 공급: ${a.supplyTotalKey || a.supplyUnitKey || '-'} / 매입: ${a.purchaseTotalKey || a.purchaseUnitKey || '-'}</span></div><div class="issue-num">확인</div></div>
        </div></article>

        <article class="card full"><div class="card-head"><div><div class="card-title">쿠팡 원본 데이터 전체 보기</div><div class="card-sub">기간 내 ${fmt(a.periodObjects.length)}행 / 현재 표시 ${fmt(a.objects.length)}행 / 페이지당 ${fmt(state.coupang.pageSize)}행</div></div></div>
          <div class="table-tools">
            <div class="tool-left">
              <select id="coupangPageSize" onchange="setCoupangPageSize(this.value)">
                <option value="30" ${state.coupang.pageSize === 30 ? 'selected' : ''}>30개씩</option>
                <option value="50" ${state.coupang.pageSize === 50 ? 'selected' : ''}>50개씩</option>
                <option value="100" ${state.coupang.pageSize === 100 ? 'selected' : ''}>100개씩</option>
                <option value="999999" ${state.coupang.pageSize === 999999 ? 'selected' : ''}>전체 보기</option>
              </select>
              <div class="pill">${basisLabel}</div>
            </div>
            <div class="tool-right"><div class="pill">${document.getElementById('periodLabel').textContent}</div><div class="pill">${a.objects.length ? fmt(start + 1) : 0} - ${fmt(Math.min(start + state.coupang.pageSize, a.objects.length))} / ${fmt(a.objects.length)}</div></div>
          </div>
          <div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h || '-'}</th>`).join('')}</tr></thead><tbody>${table}</tbody></table></div>
          <div class="pagination">
            <button onclick="setCoupangPage(1)">처음</button>
            <button onclick="setCoupangPage(${state.coupang.page - 1})">이전</button>
            <span class="page-info">${fmt(state.coupang.page)} / ${fmt(totalPages)} 페이지</span>
            <button onclick="setCoupangPage(${state.coupang.page + 1})">다음</button>
            <button onclick="setCoupangPage(${totalPages})">마지막</button>
          </div>
        </article>
      `);
    }

    function setCoupangDate(value) {
      state.coupang.date = value;
      state.coupang.page = 1;
      renderCoupang();
    }

    function setCoupangBasis(value) {
      state.coupang.basis = value;
      renderCoupang();
    }

    function setCoupangPage(page) {
      state.coupang.page = Number(page);
      renderCoupang();
    }

    function setCoupangPageSize(value) {
      state.coupang.pageSize = Number(value);
      state.coupang.page = 1;
      renderCoupang();
    }

    function setCoupangFlowMode(value) {
      state.coupang.flowMode = value;
      renderCoupang();
    }

    function setPaymentVendorPeriod(value) {
      state.payment.vendorPeriod = value;
      renderPayment();
    }

    function setPaymentVendor(value) {
      state.payment.selectedVendor = value;
      renderPayment();
    }

    function setPaymentMonthRange(type, value) {
      if (type === 'start') state.payment.startMonth = value;
      if (type === 'end') state.payment.endMonth = value;
      state.payment.selectedFlowPeriod = '';
      renderPayment();
    }

    function setPaymentFlowPeriod(label) {
      state.payment.selectedFlowPeriod = label;
      renderPayment();
    }

    function paymentObjectsForVendorFlow(a, periodLabel) {
      const selected = state.payment.selectedVendor;
      return (a.paymentObjects || []).filter(o => {
        const d = toDate(o[a.dateKey]);
        if (!d) return false;
        const monthKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        const key = state.payment.vendorPeriod === 'monthly' ? monthKey : dateStr(d);
        const vendor = a.vendorKey ? (o[a.vendorKey] || '거래처 미지정') : '거래처 미지정';
        return key === periodLabel && (selected === 'all' || vendor === selected);
      }).sort((x,y)=>toDate(x[a.dateKey])-toDate(y[a.dateKey]));
    }

    function getProductionAnalysis() {
      const rows = state.raw.production || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['날짜','일자','제작일','생산일','작업일','등록일','date']);
      const productKey = findHeader(headers, ['상품명','제품명','품목명','품목','모델','옵션','sku','SKU','제품']);
      const workerKey = findHeader(headers, ['작업자','담당자','생산자','작업인원','직원']);
      const qtyKey = findHeader(headers, ['제작수량','생산수량','완성수량','완료수량','양품수량','수량']);
      const goodKey = findHeader(headers, ['양품수량','정상수량','완료수량','양품']);
      const defectKey = findHeader(headers, ['불량수량','폐기수량','불량','폐기','NG']);
      const reasonKey = findHeader(headers, ['불량사유','폐기사유','원인','이슈','비고','메모']);
      const targetKey = findHeader(headers, ['목표수량','목표','계획수량','계획']);

      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;

      function rowQty(o) {
        if (qtyKey) return toNum(o[qtyKey]);
        if (goodKey || defectKey) return toNum(o[goodKey]) + toNum(o[defectKey]);
        return 1;
      }

      function rowGood(o) {
        if (goodKey) return toNum(o[goodKey]);
        return Math.max(rowQty(o) - rowDefect(o), 0);
      }

      function rowDefect(o) {
        return defectKey ? toNum(o[defectKey]) : 0;
      }

      function rowTarget(o) {
        return targetKey ? toNum(o[targetKey]) : 0;
      }

      const totalQty = objects.reduce((s,o)=>s+rowQty(o),0);
      const totalGood = objects.reduce((s,o)=>s+rowGood(o),0);
      const totalDefect = objects.reduce((s,o)=>s+rowDefect(o),0);
      const totalTarget = objects.reduce((s,o)=>s+rowTarget(o),0);
      const goodRate = totalQty ? pct(totalGood, totalQty) : '0.00%';
      const defectRate = totalQty ? pct(totalDefect, totalQty) : '0.00%';
      const defectRateNumber = totalQty ? (totalDefect / totalQty) * 100 : 0;
      const defectGoalPassed = defectRateNumber < 5;
      const defectGoalLabel = defectGoalPassed ? '목표 달성' : '관리 필요';
      const targetRate = defectGoalLabel;

      const dailyMap = {};
      objects.forEach(o => {
        const d = dateStr(toDate(o[dateKey]));
        if (d === '-') return;
        if (!dailyMap[d]) dailyMap[d] = { label: d, date: toDate(o[dateKey]), qty: 0, good: 0, defect: 0, target: 0, value: 0 };
        dailyMap[d].qty += rowQty(o);
        dailyMap[d].good += rowGood(o);
        dailyMap[d].defect += rowDefect(o);
        dailyMap[d].target += rowTarget(o);
        dailyMap[d].value += rowQty(o);
      });
      const daily = Object.values(dailyMap).sort((a,b)=>a.date-b.date);

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, qty: 0, good: 0, defect: 0, value: 0 };
        productMap[name].qty += rowQty(o);
        productMap[name].good += rowGood(o);
        productMap[name].defect += rowDefect(o);
        productMap[name].value += rowQty(o);
      });
      const productRank = Object.values(productMap).sort((a,b)=>b.qty-a.qty);

      const workerMap = {};
      objects.forEach(o => {
        const name = workerKey ? (String(o[workerKey] || '').trim() || '작업자 미지정') : '작업자 미지정';
        if (!workerMap[name]) workerMap[name] = { name, qty: 0, defect: 0, value: 0 };
        workerMap[name].qty += rowQty(o);
        workerMap[name].defect += rowDefect(o);
        workerMap[name].value += rowQty(o);
      });
      const workerRank = Object.values(workerMap).sort((a,b)=>b.qty-a.qty);

      const reasonMap = {};
      objects.forEach(o => {
        const defect = rowDefect(o);
        if (!defect) return;
        const reason = reasonKey ? (String(o[reasonKey] || '').trim() || '사유 미기재') : '사유 미기재';
        if (!reasonMap[reason]) reasonMap[reason] = { name: reason, qty: 0, value: 0 };
        reasonMap[reason].qty += defect;
        reasonMap[reason].value += defect;
      });
      const reasonRank = Object.values(reasonMap).sort((a,b)=>b.qty-a.qty);

      return {
        headers,
        allObjects,
        objects,
        dateKey,
        productKey,
        workerKey,
        qtyKey,
        goodKey,
        defectKey,
        reasonKey,
        targetKey,
        totalQty,
        totalGood,
        totalDefect,
        totalTarget,
        goodRate,
        defectRate,
        targetRate,
        defectRateNumber,
        defectGoalPassed,
        defectGoalLabel,
        daily,
        productRank,
        workerRank,
        reasonRank
      };
    }

    function renderProductionRank(items, valueLabel = '개', limit = 8) {
      const top = (items || []).filter(r => r && r.name).slice(0, limit);
      const max = Math.max(...top.map(r => r.value || r.qty || 0), 1);
      if (!top.length) return '<div class="empty">표시할 데이터가 없습니다.</div>';
      return `<div class="rank-chart">${top.map((r, i) => {
        const value = r.value || r.qty || 0;
        return `<div class="rank-row">
          <div class="rank-name">${i + 1}. ${r.name}</div>
          <div class="rank-track"><div class="rank-fill" style="width:${Math.max((value / max) * 100, 2)}%"></div></div>
          <div class="rank-value">${fmt(value)}${valueLabel}</div>
          <div class="rank-qty">${r.defect ? `불량 ${fmt(r.defect)}` : ''}</div>
        </div>`;
      }).join('')}</div>`;
    }

    function getPaymentAnalysis() {
      const paymentRows = state.raw.payments || [];
      const poRows = state.raw.po || [];

      const paymentHeaders = paymentRows[0] || [];
      const paymentObjects = rowsToObjects(paymentRows);
      const poObjects = rowsToObjects(poRows);

      const dateKey = findHeader(paymentHeaders, ['결제일','예정일','결제예정일','날짜','일자']);
      const vendorKey = findHeader(paymentHeaders, ['거래처','업체','공급처']);
      const productKey = findHeader(paymentHeaders, ['상품명','품목명','제품명','품목','제품']);
      const typeKey = findHeader(paymentHeaders, ['결제유형','유형','선급금','잔금','구분']);
      const inboundKey = findHeader(paymentHeaders, ['입고일','입고예정일','도착일']);

      const usdKey = findHeader(paymentHeaders, ['USD','외화','달러','송금USD']);
      const krwKey = findHeader(paymentHeaders, ['원화','KRW','결제원화','한화']);
      const poHeaders = poRows[0] || [];
      const poNumberKey = findHeader(poHeaders, ['PO번호','PO','발주번호','ORDER']);
      const poProductKey = findHeader(poHeaders, ['상품명','품목명','제품명','품목','제품']);
      const poTotalKey = findHeader(poHeaders, ['총PO금액(외화)','총PO금액','PO금액','총발주금액']);
      const poAdvanceKey = findHeader(poHeaders, ['총선급금(외화)','총선급금','선급금']);
      const poInboundPaidKey = findHeader(poHeaders, ['누적입고물품금액(외화)','누적입고물품금액','입고물품금액']);
      const poNotInboundKey = findHeader(poHeaders, ['미입고물품금액(외화)','미입고물품금액','미입고금액']);
      const poRemainQtyKey = findHeader(poHeaders, ['잔여수량','미입고수량','남은수량','잔량']) || poHeaders[16];

      function getPoRemainQty(o) {
        const byHeader = poRemainQtyKey ? toNum(o[poRemainQtyKey]) : 0;
        const byQColumn = o._row ? toNum(o._row[16]) : 0;
        return byHeader || byQColumn;
      }

      const objects = dateKey ? filterObjectsByDate(paymentObjects, dateKey) : paymentObjects;

      const today = new Date();
      today.setHours(0,0,0,0);

      const upcomingPayments = paymentObjects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d >= today;
      }).sort((a,b) => toDate(a[dateKey]) - toDate(b[dateKey]));

      const upcomingUsd = upcomingPayments.reduce((s,o)=>s+toNum(o[usdKey]),0);
      const upcomingKrw = upcomingPayments.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const nearestPaymentDate = upcomingPayments.length ? dateStr(toDate(upcomingPayments[0][dateKey])) : '-';

      const upcomingDailyMap = {};
      upcomingPayments.forEach(o => {
        const d = dateStr(toDate(o[dateKey]));
        if (d === '-') return;
        if (!upcomingDailyMap[d]) upcomingDailyMap[d] = { name: d, label: d, value: 0, usd: 0, qty: 0 };
        upcomingDailyMap[d].value += toNum(o[krwKey]);
        upcomingDailyMap[d].usd += toNum(o[usdKey]);
        upcomingDailyMap[d].qty += 1;
      });
      const upcomingDaily = Object.values(upcomingDailyMap).sort((a,b) => a.name.localeCompare(b.name));

      const scheduledPaymentsInPeriod = objects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d >= today;
      });

      const paidPaymentsInPeriod = objects.filter(o => {
        const d = toDate(o[dateKey]);
        if (!d) return false;
        d.setHours(0,0,0,0);
        return d < today;
      });

      const scheduledKrwInPeriod = scheduledPaymentsInPeriod.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const paidKrwInPeriod = paidPaymentsInPeriod.reduce((s,o)=>s+toNum(o[krwKey]),0);

      const totalUsd = objects.reduce((s,o)=>s+toNum(o[usdKey]),0);
      const totalKrw = objects.reduce((s,o)=>s+toNum(o[krwKey]),0);
      const totalPoAmount = poObjects.reduce((s,o)=>s+toNum(o[poTotalKey]),0);
      const totalAdvance = poObjects.reduce((s,o)=>s+toNum(o[poAdvanceKey]),0);
      const totalInboundPaid = poObjects.reduce((s,o)=>s+toNum(o[poInboundPaidKey]),0);
      const totalNotInbound = poObjects.reduce((s,o)=>s+toNum(o[poNotInboundKey]),0);
      const EXCHANGE_RATE = 1500;
      const totalPoAmountKrw = usdToKrw(totalPoAmount);
      const totalNotInboundKrw = usdToKrw(totalNotInbound);
      const totalAdvanceKrw = usdToKrw(totalAdvance);
      const totalInboundPaidKrw = usdToKrw(totalInboundPaid);

      const vendorMap = {};
      const vendorFlowMap = {};
      const poMap = {};
      const productMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (o[vendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = {
          name,
          value: 0,
          qty: 0,
          usd: 0,
          po: 0,
          advance: 0,
          inbound: 0,
          remaining: 0,
            remainQty: 0,
          paymentRate: 0
        };
        vendorMap[name].value += toNum(o[krwKey]);
        vendorMap[name].usd += toNum(o[usdKey]);
        vendorMap[name].qty += 1;
      });

      // 업체별 결제 흐름은 상단 전체 기간 필터가 아니라, 이 섹션의 월 선택 범위를 기준으로 별도 집계한다.
      paymentObjects.forEach(o => {
        const name = vendorKey ? (o[vendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!name || name === '거래처 미지정') return;

        const paymentDate = toDate(o[dateKey]);
        if (!paymentDate) return;

        const monthKey = `${paymentDate.getFullYear()}-${String(paymentDate.getMonth()+1).padStart(2,'0')}`;
        const flowKey = state.payment.vendorPeriod === 'monthly' ? monthKey : dateStr(paymentDate);

        if (!vendorFlowMap[flowKey]) vendorFlowMap[flowKey] = {};
        if (!vendorFlowMap[flowKey][name]) vendorFlowMap[flowKey][name] = 0;
        vendorFlowMap[flowKey][name] += toNum(o[krwKey]);
      });

      poObjects.forEach(o => {
        const poNo = poNumberKey ? (o[poNumberKey] || '').trim() : '';
        const productName = poProductKey ? (o[poProductKey] || '').trim() : '';

        if (poNo) {
          if (!poMap[poNo]) poMap[poNo] = {
            name: poNo,
            poName: poNo,
            productName: productName || poNo,
            po: 0,
            advance: 0,
            inbound: 0,
            remaining: 0,
            remainQty: 0,
            paymentRate: 0,
            value: 0
          };

          poMap[poNo].po += toNum(o[poTotalKey]);
          poMap[poNo].advance += toNum(o[poAdvanceKey]);
          poMap[poNo].inbound += toNum(o[poInboundPaidKey]);
          poMap[poNo].remaining += toNum(o[poNotInboundKey]);
          poMap[poNo].remainQty += getPoRemainQty(o);
        }

        if (productName) {
          if (!productMap[productName]) productMap[productName] = {
            name: productName,
            po: 0,
            advance: 0,
            inbound: 0,
            remaining: 0,
            remainQty: 0,
            paymentRate: 0,
            value: 0
          };

          productMap[productName].po += toNum(o[poTotalKey]);
          productMap[productName].advance += toNum(o[poAdvanceKey]);
          productMap[productName].inbound += toNum(o[poInboundPaidKey]);
          productMap[productName].remaining += toNum(o[poNotInboundKey]);
          productMap[productName].remainQty += getPoRemainQty(o);
        }
        const poVendorKey = findHeader(poHeaders, ['거래처','업체','공급처']);
        const name = poVendorKey ? (o[poVendorKey] || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = {
          name,
          value: 0,
          qty: 0,
          usd: 0,
          po: 0,
          advance: 0,
          inbound: 0,
          remaining: 0,
            remainQty: 0,
          paymentRate: 0
        };

        vendorMap[name].po += toNum(o[poTotalKey]);
        vendorMap[name].advance += toNum(o[poAdvanceKey]);
        vendorMap[name].inbound += toNum(o[poInboundPaidKey]);
        vendorMap[name].remaining += toNum(o[poNotInboundKey]);
      });

      Object.values(vendorMap).forEach(v => {
        v.paymentRate = v.po ? (v.advance / v.po) * 100 : 0;
        v.value = usdToKrw(v.po);
      });

      const paymentMonthValues = [...new Set(Object.keys(vendorFlowMap).map(k => k.slice(0,7)))].sort();
      if (!state.payment.startMonth && paymentMonthValues.length) state.payment.startMonth = paymentMonthValues[0];
      if (!state.payment.endMonth && paymentMonthValues.length) state.payment.endMonth = paymentMonthValues[paymentMonthValues.length - 1];

      const vendorFlowMapFiltered = {};
      Object.entries(vendorFlowMap).forEach(([period, vendors]) => {
        const monthKey = period.slice(0,7);
        const startOk = !state.payment.startMonth || monthKey >= state.payment.startMonth;
        const endOk = !state.payment.endMonth || monthKey <= state.payment.endMonth;
        if (startOk && endOk) vendorFlowMapFiltered[period] = vendors;
      });

      Object.values(poMap).forEach(v => {
        v.paymentRate = v.po ? (v.advance / v.po) * 100 : 0;
        v.value = usdToKrw(v.po);
      });

      Object.values(productMap).forEach(v => {
        v.paymentRate = v.po ? (v.advance / v.po) * 100 : 0;
        v.value = usdToKrw(v.po);
      });

      Object.values(vendorMap).forEach(v => {
        v.paymentRate = v.po ? (v.advance / v.po) * 100 : 0;
        v.value = usdToKrw(v.po);
      });

      const typeMap = {};
      objects.forEach(o => {
        const name = typeKey ? (o[typeKey] || '유형 미지정') : '유형 미지정';
        if (!typeMap[name]) typeMap[name] = { name, value: 0, qty: 0 };
        typeMap[name].value += toNum(o[krwKey]);
        typeMap[name].qty += 1;
      });

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += toNum(o[krwKey]);
        dailyMap[key].qty += 1;
      });

      const poDetailRank = poObjects.map((o, idx) => {
        const poNo = poNumberKey ? (o[poNumberKey] || '').trim() : '';
        const productName = poProductKey ? (o[poProductKey] || '').trim() : '';
        const poAmount = toNum(o[poTotalKey]);
        const advanceAmount = toNum(o[poAdvanceKey]);
        const inboundAmount = toNum(o[poInboundPaidKey]);
        const notInboundAmount = toNum(o[poNotInboundKey]);
        const remainQty = getPoRemainQty(o);
        const paymentRate = poAmount ? (advanceAmount / poAmount) * 100 : 0;

        return {
          name: poNo || `PO-${idx + 1}`,
          poName: poNo || `PO-${idx + 1}`,
          productName: productName || poNo || `PO-${idx + 1}`,
          po: poAmount,
          advance: advanceAmount,
          inbound: inboundAmount,
          remaining: notInboundAmount,
          remainQty,
          paymentRate,
          value: usdToKrw(poAmount)
        };
      }).filter(r => r.po > 0 && r.paymentRate < 100);

      return {
        paymentHeaders,
        paymentObjects,
        objects,
        poObjects,
        dateKey,
        vendorKey,
        productKey,
        typeKey,
        inboundKey,
        usdKey,
        krwKey,
        poTotalKey,
        poAdvanceKey,
        poInboundPaidKey,
        poNotInboundKey,
        poRemainQtyKey,
        totalUsd,
        totalKrw,
        scheduledPaymentsInPeriod,
        paidPaymentsInPeriod,
        scheduledKrwInPeriod,
        paidKrwInPeriod,
        upcomingPayments,
        upcomingUsd,
        upcomingKrw,
        nearestPaymentDate,
        upcomingDaily,
        totalPoAmount,
        totalAdvance,
        totalInboundPaid,
        totalNotInbound,
        totalPoAmountKrw,
        totalAdvanceKrw,
        totalInboundPaidKrw,
        totalNotInboundKrw,
        vendorRank: Object.values(vendorMap)
          .filter(v => v.name && v.name !== '거래처 미지정' && v.paymentRate < 100)
          .sort((a,b)=>b.value-a.value),
        vendorPaymentRank: Object.values(vendorMap)
          .filter(v => v.name && v.name !== '거래처 미지정' && v.paymentRate < 100)
          .sort((a,b)=>b.paymentRate-a.paymentRate),
        poRank: Object.values(poMap)
          .filter(v => v.paymentRate < 100)
          .sort((a,b)=>b.value-a.value),
        poPaymentRank: poDetailRank.sort((a,b)=>b.paymentRate-a.paymentRate),
        productPaymentRank: Object.values(productMap)
          .filter(v => v.paymentRate < 100)
          .sort((a,b)=>b.paymentRate-a.paymentRate),
        typeRank: Object.values(typeMap).sort((a,b)=>b.value-a.value),
        dailyFlow: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorFlowMap: vendorFlowMapFiltered,
        paymentMonthValues
      };
    }

    function renderPayment() {
      const a = getPaymentAnalysis();

      const previewRows = a.objects.slice(0, 40).map(o => `
        <tr>
          <td>${o[a.dateKey] || '-'}</td>
          <td>${o[a.productKey] || '-'}</td>
          <td>${o[a.vendorKey] || '-'}</td>
          <td>${o[a.typeKey] || '-'}</td>
          <td>${o[a.inboundKey] || '-'}</td>
          <td class="right">${fmt(toNum(o[a.usdKey]))}</td>
          <td class="right">${money(toNum(o[a.krwKey]))}</td>
          <td class="right">${(() => {
            const vendor = o[a.vendorKey] || '거래처 미지정';
            const found = a.vendorPaymentRank.find(v => v.name === vendor);
            return found ? found.paymentRate.toFixed(1) + '%' : '-';
          })()}</td>
          
        </tr>
      `).join('');

      grid(`
        ${metricCard('외화 결제액','USD 기준 합계',fmt(a.totalUsd),a.usdKey || '외화 컬럼 없음','good',a.dailyFlow.map(r=>r.value))}
        ${metricCard('원화 결제액','KRW 기준 합계',money(a.totalKrw),a.krwKey || '원화 컬럼 없음','good',a.dailyFlow.map(r=>r.value))}
        ${metricCard('총 PO금액','환율 1,500원 적용',money(a.totalPoAmountKrw),`${usd(a.totalPoAmount)} × 1,500원`, 'good',[a.totalPoAmountKrw])}
        ${metricCard('미입고 물품금액','환율 1,500원 적용',money(a.totalNotInboundKrw),`${usd(a.totalNotInbound)} × 1,500원`,a.totalNotInbound > 0 ? 'warn' : 'good',[a.totalNotInboundKrw])}
        

        <article class="card wide"><div class="card-head"><div><div class="card-title">업체별 결제 흐름 분석</div><div class="card-sub">거래처별 월별 / 일별 지출 흐름</div></div><span class="badge">운영 분석용</span></div>
          <div class="table-tools">
            <div class="tool-left">
              <select onchange="setPaymentVendorPeriod(this.value)">
                <option value="monthly" ${state.payment.vendorPeriod === 'monthly' ? 'selected' : ''}>월별 보기</option>
                <option value="daily" ${state.payment.vendorPeriod === 'daily' ? 'selected' : ''}>일별 보기</option>
              </select>
              <select onchange="setPaymentVendor(this.value)">
                <option value="all">전체 업체</option>
                ${a.vendorRank.map(v => `<option value="${v.name}" ${state.payment.selectedVendor === v.name ? 'selected' : ''}>${v.name}</option>`).join('')}
              </select>
              <input type="month" value="${state.payment.startMonth}" onchange="setPaymentMonthRange('start', this.value)" />
              <input type="month" value="${state.payment.endMonth}" onchange="setPaymentMonthRange('end', this.value)" />
              <div class="pill">월 범위 선택</div>
            </div>
          </div>
          ${(() => {
            const flowEntries = Object.entries(a.vendorFlowMap || {});
            const selected = state.payment.selectedVendor;
            const chartData = flowEntries.map(([label, vendors]) => ({
              label,
              value: selected === 'all'
                ? Object.values(vendors).reduce((s,v)=>s+v,0)
                : (vendors[selected] || 0),
              qty: Object.keys(vendors).length
            })).filter(r => r.value > 0).sort((x,y)=>x.label.localeCompare(y.label));

            const selectedPeriod = state.payment.selectedFlowPeriod || chartData[0]?.label || '';
            const detailRows = paymentObjectsForVendorFlow(a, selectedPeriod).slice(0, 20);
            const detailTotal = detailRows.reduce((s,o)=>s+toNum(o[a.krwKey]),0);

            return `
              ${renderCoupangFlowChart(chartData, { clickFn: 'setPaymentFlowPeriod' })}
              <div class="table-wrap" style="margin-top:18px; position:relative; z-index:1;">
                <div class="card-head" style="padding:0; margin-bottom:10px;">
                  <div><div class="card-title">${selectedPeriod || '-'} 결제 상세</div><div class="card-sub">선택한 그래프 구간의 품목 / 거래처 / 결제금액</div></div>
                  <span class="badge">${money(detailTotal)}</span>
                </div>
                <table>
                  <thead><tr><th>결제일</th><th>품목</th><th>거래처</th><th>결제유형</th><th class="right">원화</th></tr></thead>
                  <tbody>${detailRows.map(o=>`
                    <tr>
                      <td>${o[a.dateKey] || '-'}</td>
                      <td>${o[a.productKey] || '-'}</td>
                      <td>${o[a.vendorKey] || '-'}</td>
                      <td>${o[a.typeKey] || '-'}</td>
                      <td class="right">${money(toNum(o[a.krwKey]))}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="5" class="muted">선택 구간의 결제 데이터가 없습니다.</td></tr>'}</tbody>
                </table>
              </div>

    function getInboundAnalysis() {
      const rows = state.raw.inbound || [];
      const headers = rows[0] || [];
      const allObjects = rowsToObjects(rows);

      const dateKey = findHeader(headers, ['입고예정일','예정일','입고일','도착일','날짜','일자']);
      const vendorKey = findHeader(headers, ['거래처','업체','공급처','공장']);
      const productKey = findHeader(headers, ['상품명','품목명','제품명','품목','제품','모델','옵션']);
      const qtyKey = findHeader(headers, ['입고수량','예정수량','수량','입고예정수량']);
      const statusKey = findHeader(headers, ['상태','진행상태','입고상태','비고']);
      const poKey = findHeader(headers, ['PO번호','PO','발주번호','주문번호']);
      const amountKey = findHeader(headers, ['입고금액','예정금액','물품금액','금액','원화','KRW']);

      const objects = dateKey ? filterObjectsByDate(allObjects, dateKey) : allObjects;
      const today = new Date();
      today.setHours(0,0,0,0);

      function rowQty(o) { return qtyKey ? toNum(o[qtyKey]) : 1; }
      function rowAmount(o) { return amountKey ? toNum(o[amountKey]) : 0; }
      function rowStatus(o) { return statusKey ? String(o[statusKey] || '').trim() : ''; }

      const totalQty = objects.reduce((s,o)=>s+rowQty(o),0);
      const totalAmount = objects.reduce((s,o)=>s+rowAmount(o),0);
      const completed = objects.filter(o => rowStatus(o).includes('완료') || rowStatus(o).includes('입고완료'));
      const delayed = objects.filter(o => {
        const d = toDate(o[dateKey]);
        const status = rowStatus(o);
        return d && d < today && !status.includes('완료');
      });
      const upcoming = objects.filter(o => {
        const d = toDate(o[dateKey]);
        const status = rowStatus(o);
        return d && d >= today && !status.includes('완료');
      }).sort((a,b)=>toDate(a[dateKey])-toDate(b[dateKey]));

      const dailyMap = {};
      objects.forEach(o => {
        const d = toDate(o[dateKey]);
        if (!d) return;
        const key = dateStr(d);
        if (!dailyMap[key]) dailyMap[key] = { label:key, date:d, value:0, qty:0 };
        dailyMap[key].value += rowQty(o);
        dailyMap[key].qty += rowQty(o);
      });

      const vendorMap = {};
      objects.forEach(o => {
        const name = vendorKey ? (String(o[vendorKey] || '').trim() || '거래처 미지정') : '거래처 미지정';
        if (!vendorMap[name]) vendorMap[name] = { name, qty:0, value:0 };
        vendorMap[name].qty += rowQty(o);
        vendorMap[name].value += rowAmount(o) || rowQty(o);
      });

      const productMap = {};
      objects.forEach(o => {
        const name = productKey ? (String(o[productKey] || '').trim() || '품목 미지정') : '품목 미지정';
        if (!productMap[name]) productMap[name] = { name, qty:0, value:0 };
        productMap[name].qty += rowQty(o);
        productMap[name].value += rowQty(o);
      });

      const statusMap = {};
      objects.forEach(o => {
        const name = rowStatus(o) || '상태 미지정';
        if (!statusMap[name]) statusMap[name] = { name, qty:0, value:0 };
        statusMap[name].qty += 1;
        statusMap[name].value += rowQty(o);
      });

      return {
        headers, objects, dateKey, vendorKey, productKey, qtyKey, statusKey, poKey, amountKey,
        totalQty, totalAmount, completed, delayed, upcoming,
        daily: Object.values(dailyMap).sort((a,b)=>a.date-b.date),
        vendorRank: Object.values(vendorMap).filter(v=>v.name !== '거래처 미지정').sort((a,b)=>b.value-a.value),
        productRank: Object.values(productMap).filter(v=>v.name !== '품목 미지정').sort((a,b)=>b.qty-a.qty),
        statusRank: Object.values(statusMap).sort((a,b)=>b.qty-a.qty)
      };
    }

        <article class="card half"><div class="card-head"><div><div class="card-title">품목별 입고 예정 TOP</div><div class="card-sub">입고 예정수량 큰 순</div></div></div>${renderProductRankChart(a.productRank, 8)}</article>

        <article class="card half"><div class="card-head"><div><div class="card-title">입고 상태 요약</div><div class="card-sub">상태 컬럼 기준</div></div></div>${renderProductRankChart(a.statusRank, 8)}</article>
        <article class="card half"><div class="card-head"><div><div class="card-title">다가오는 입고 일정</div><div class="card-sub">오늘 이후 미완료 건</div></div><span class="badge">${fmt(a.upcoming.length)}건</span></div><div class="issue-list">
          ${a.upcoming.slice(0,8).map(o => `
            <div class="issue"><div class="issue-icon">📥</div><div><strong>${o[a.productKey] || '품목 미지정'}</strong><span>${o[a.dateKey] || '-'} / ${o[a.vendorKey] || '-'}</span></div><div class="issue-num">${fmt(toNum(o[a.qtyKey]))}</div></div>
          `).join('') || '<div class="empty">다가오는 입고 예정이 없습니다.</div>'}
        </div></article>

        <article class="card full"><div class="card-head"><div><div class="card-title">입고 예정 상세 데이터</div><div class="card-sub">선택 기간 기준 상위 40행</div></div></div>
          <div class="table-wrap"><table><thead><tr><th>예정일</th><th>품목</th><th>거래처</th><th>PO</th><th class="right">수량</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>
        </article>
      `);
    }

    function renderGeneric(tab) {
      const config = genericTabConfig(tab);
      const rows = state.raw[config.key] || [];
      if (!rows.length) {
        grid(`<article class="card full"><div class="card-head"><div><div class="card-title">${config.title}</div><div class="card-sub">데이터 로드 실패</div></div></div><div class="empty">이 탭의 시트 데이터를 불러오지 못했습니다. 공유 권한 또는 게시 설정을 확인해 주세요.</div></article>`);
        return;
      }
      const a = analyzeGeneric(rows, config);
      const preview = a.objects.slice(0, 10);
      const headers = a.headers.slice(0, 6);
      const table = preview.map(o => `<tr>${headers.map(h => `<td>${o[h] || '-'}</td>`).join('')}</tr>`).join('');
      const chartData = a.dated.filter(x => x.date).slice(-7);
      grid(`
        ${metricCard(`${config.title} 데이터`, '행 개수', fmt(a.objects.length), '빈 행 제외 기준', 'good', [a.objects.length])}
        ${metricCard('주요 수치 합계', a.mainKey || '자동 감지', fmt(a.total), a.mainKey ? `${a.mainKey} 기준` : '숫자열 없음', 'good', chartData.map(x=>x.value))}
        ${metricCard('날짜 열', '자동 감지', a.dateKey || '없음', a.dateKey ? '일정 기반 분석 가능' : '날짜열 확인 필요', a.dateKey ? 'good' : 'warn', [1])}
        ${metricCard('연결 상태', SHEETS[config.key]?.name || config.title, '연결됨', '구글시트 CSV 로드 완료', 'good', [1])}
        <article class="card wide"><div class="card-head"><div><div class="card-title">${config.icon} ${config.title} 추이</div><div class="card-sub">감지된 날짜/수량 기준 최근 7개 항목</div></div></div>${chartData.length ? `${renderBarChart(chartData, 'value', 'label')}` : '<div class="empty">날짜 기반 차트로 표시할 데이터가 부족합니다.</div>'}</article>
        <article class="card side"><div class="card-head"><div><div class="card-title">자동 분석 결과</div><div class="card-sub">현재 시트 구조 기준</div></div></div><div class="issue-list">
          <div class="issue"><div class="issue-icon">${config.icon}</div><div><strong>데이터 행</strong><span>${SHEETS[config.key]?.name || '-'} 탭 기준</span></div><div class="issue-num">${fmt(a.objects.length)}</div></div>
          <div class="issue"><div class="issue-icon">#</div><div><strong>숫자 열</strong><span>${a.mainKey || '확인 필요'}</span></div><div class="issue-num">${fmt(a.total)}</div></div>
          <div class="issue"><div class="issue-icon">📅</div><div><strong>날짜 열</strong><span>${a.dateKey || '확인 필요'}</span></div><div class="issue-num">${a.dateKey ? 'OK' : '!'}</div></div>
        </div></article>
        <article class="card full"><div class="card-head"><div><div class="card-title">원본 데이터 미리보기</div><div class="card-sub">상위 10행 / 상위 6열</div></div></div><table><thead><tr>${headers.map(h=>`<th>${h || '-'}</th>`).join('')}</tr></thead><tbody>${table}</tbody></table></article>
      `);
    }

    function renderProgressHtml() {
      const items = [
        ['택배 / 출고', !!state.raw.shipping?.length],
        ['제작 현황', !!state.raw.production?.length],
        ['결제 관리', !!state.raw.payments?.length],
        ['입고 예정', !!state.raw.inbound?.length],
        ['쿠팡 판매', !!state.raw.coupang?.length],
        ['발주 필요', !!state.raw.reorder?.length]
      ];
      return items.map(([name, ok]) => `<div class="progress-row"><div class="progress-top"><span>${name}</span><span>${ok ? '100%' : '0%'}</span></div><div class="track"><div class="fill" style="width:${ok ? 100 : 0}%"></div></div></div>`).join('');
    }

    function renderCurrentTab() {
      document.querySelectorAll('.nav-item[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === state.tab));
      const [title, desc] = titles[state.tab];
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageDesc').textContent = desc;
      if (!state.loaded) return;
      if (state.tab === 'overview') renderOverview();
      else if (state.tab === 'shipping') renderShipping();
      else if (state.tab === 'coupang') renderCoupang();
      else if (state.tab === 'production') renderProduction();
      else if (state.tab === 'payment') renderPayment();
      else if (state.tab === 'inbound') renderInbound();
      else renderGeneric(state.tab);
    }

    async function refreshDashboard() {
      const errorEl = document.getElementById('loadError');
      errorEl.textContent = '';
      grid(`<article class="card full"><div class="empty">구글시트 데이터를 불러오는 중입니다.</div></article>`);
      try {
        const entries = await Promise.allSettled(Object.entries(SHEETS).map(async ([key, sheet]) => [key, await loadSheet(sheet.gid)]));
        entries.forEach(result => { if (result.status === 'fulfilled') state.raw[result.value[0]] = result.value[1]; });
        if (!state.raw.shipping) throw new Error('택배_일별 시트를 불러오지 못했습니다. 공유 권한 또는 웹 게시 설정을 확인해 주세요.');
        state.shipping = getShippingData(state.raw.shipping);
        state.filteredShipping = filterByPeriod(state.shipping);
        state.loaded = true;
        document.getElementById('lastSync').textContent = `동기화 ${new Date().toLocaleString('ko-KR')}`;
        renderCurrentTab();
      } catch (err) {
        errorEl.textContent = err.message || '데이터 로드 중 오류가 발생했습니다.';
        grid(`<article class="card full"><div class="empty">데이터를 불러오지 못했습니다.</div></article>`);
      }
    }

    document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
      el.addEventListener('click', () => {
        state.tab = el.dataset.tab;
        renderCurrentTab();
      });
    });

    document.getElementById('periodSelect').addEventListener('change', () => {
      const isCustom = document.getElementById('periodSelect').value === 'custom';
      document.getElementById('customDateBox').classList.toggle('show', isCustom);
      if (!state.shipping.length) return;
      if (!isCustom) applyPeriodAndRender();
    });

    document.getElementById('startDateInput').addEventListener('change', applyPeriodAndRender);
    document.getElementById('endDateInput').addEventListener('change', applyPeriodAndRender);

    refreshDashboard();
  </script>
</body>
</html>
